[package]
name = "hydrant-optimizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local exact MIT course scheduler with a terminal UI and calendar export"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
icalendar = { version = "0.17", features = ["parser"] }
portable-pty = "0.9"
vt100 = "0.16"

[profile.release]
lto = "thin"
strip = true
